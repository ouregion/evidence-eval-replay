[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-eval-replay"
version = "0.1.0"
description = "Offline synthetic evidence and quotation checks"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic==2.11.7"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["evidence_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
